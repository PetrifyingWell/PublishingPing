# Temporary diagnostic: how many pages need follower reads, and how long
# steamcommunity.com's rate limit lasts. Remove after.
name: Steam probe

on:
  push:
    branches: [claude/cool-rubin-1j77aq]
    paths: [.github/workflows/steam-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Count tracked pages
        run: |
          curl -s "$APP_URL/api/tracked" > tracked.json
          jq '{total: (.games|length), matching: ([.games[]|select(.matches and (.notifiedAt|not))]|length), pinged: ([.games[]|select(.notifiedAt)]|length), queues}' tracked.json
          jq -r '[.games[]|select(.matches and (.notifiedAt|not))|.followers] | group_by(. // -1 | if . < 0 then "none" elif . < 5 then "0-4" elif . < 20 then "5-19" elif . < 50 then "20-49" else "50+" end) | map({(.[0] // -1 | if . < 0 then "none" elif . < 5 then "0-4" elif . < 20 then "5-19" elif . < 50 then "20-49" else "50+" end): length}) | add' tracked.json
          jq -r '.games[]|select(.appid==5362020)' tracked.json
      - name: Measure the rate limit
        run: |
          ids=$(jq -r '.games[]|select(.matches)|.appid' tracked.json | head -400)
          start=$SECONDS; ok=0; limited_at=""
          for id in $ids; do
            [ $((SECONDS-start)) -ge 900 ] && break
            code=$(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0' "https://steamcommunity.com/games/$id/memberslistxml/?xml=1") || true
            if [ "$code" = 429 ]; then
              t0=$SECONDS; echo "429 after $ok reads ($((SECONDS-start))s in)"
              while :; do
                sleep 15
                code=$(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0' "https://steamcommunity.com/games/$id/memberslistxml/?xml=1") || true
                [ "$code" = 200 ] && { echo "  recovered after $((SECONDS-t0))s"; break; }
                [ $((SECONDS-start)) -ge 900 ] && break 2
              done
            fi
            ok=$((ok+1))
            sleep 1
          done
          echo "Total successful reads: $ok in $((SECONDS-start))s"
