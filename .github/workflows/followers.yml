# Reads Steam follower counts for Publishing Ping. steamcommunity.com
# rate-limits Vercel's servers, but answers GitHub's, so this workflow asks
# the app which pages are due, reads their follower counts and posts them
# back (scripts/read-followers.sh). The app on Vercel does everything else
# (criteria, Slack pings).
#
# Steam allows ~50 reads, then blocks for ~10-13 minutes. In a public repo
# (free Actions minutes) each run keeps reading for up to 50 minutes,
# waiting out those blocks: ~200 reads an hour, so every page is read about
# every 12 hours. In a private repo each run stops after ~1 minute so it
# stays inside the 2,000 free minutes a month.
#
# GitHub runs the schedule below only a few times a day, so the hourly Vercel
# cron also starts this workflow directly when GITHUB_DISPATCH_TOKEN is set
# in Vercel (see README).
#
# Setup, in the repo's Settings > Secrets and variables > Actions:
#   variable  APP_URL      https://<your-app>.vercel.app   (no trailing slash)
#   secret    CRON_SECRET  the same value as the Vercel env var
name: Steam follower counts

on:
  schedule:
    - cron: '30 * * * *' # hourly, half an hour after the Vercel cron; GitHub may start it a few minutes late
  workflow_dispatch:

concurrency:
  group: steam-followers
  cancel-in-progress: false

jobs:
  followers:
    if: vars.APP_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      APP_URL: ${{ vars.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Read follower counts and report them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Long runs only where Actions minutes are free; anything else
          # (including not being able to tell) gets the 1-minute budget.
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private 2>/dev/null)" = false ]; then
            export MAX_SECONDS=3000
          else
            export MAX_SECONDS=55
          fi
          echo "Reading for up to $MAX_SECONDS seconds."
          scripts/read-followers.sh
